<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Treegen inspector</title>
    <style>
      body { margin: 0; background: #222; color: #ddd; font: 13px system-ui; }
      #status { padding: 12px; }
    </style>
  </head>
  <body>
    <div id="status">Inspector ready. Driven by tools/inspect.js.</div>
    <script type="module">
      import * as THREE from 'three';
      import { diagnose, collect } from './tools/diagnostics.js';

      // ?generator=legacy renders mcp/generator.legacy.js instead, so an older
      // generator can be measured with today's diagnostics and compared like
      // for like. tools/inspect.js --baseline sets this up.
      const legacy = new URLSearchParams(location.search).get('generator') === 'legacy';
      const { buildTree, presets } = await import(
        legacy ? './mcp/generator.legacy.js' : './mcp/generator.js'
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      // Modes trade realism for diagnostic clarity. Shaded is what the asset
      // looks like; silhouette answers "does it read at 100m"; wireframe shows
      // where geometry actually is, colour-coded so bark and foliage separate.
      const BARK = /trunk|branch_segment/;
      const FOLIAGE = /leaf_cluster|pine_bough|foliage/;

      function buildScene(group, mode) {
        const scene = new THREE.Scene();

        if (mode === 'silhouette') {
          scene.background = new THREE.Color('#ffffff');
          group.traverse((c) => {
            if (c.isMesh) c.material = new THREE.MeshBasicMaterial({ color: '#111111' });
          });
          scene.add(group);
          return scene;
        }

        if (mode === 'wireframe') {
          scene.background = new THREE.Color('#f7f7f4');
          group.traverse((c) => {
            if (!c.isMesh) return;
            const bark = BARK.test(c.name);
            c.material = new THREE.MeshBasicMaterial({
              color: bark ? '#b4441f' : '#1f7a4c',
              wireframe: true,
              transparent: true,
              opacity: bark ? 1 : 0.55,
            });
          });
          scene.add(group);
          return scene;
        }

        scene.background = new THREE.Color('#dfe6e4');
        scene.add(new THREE.HemisphereLight('#f8f0d0', '#7d8a78', 2.2));
        const sun = new THREE.DirectionalLight('#fff4dc', 3.0);
        sun.position.set(5, 9, 4);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        sun.shadow.camera.left = -8;
        sun.shadow.camera.right = 8;
        sun.shadow.camera.top = 8;
        sun.shadow.camera.bottom = -8;
        scene.add(sun);
        group.traverse((c) => {
          if (!c.isMesh) return;
          c.castShadow = true;
          c.receiveShadow = true;
        });
        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(14, 48),
          new THREE.MeshStandardMaterial({ color: '#cfc9a4', roughness: 0.95 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        scene.add(group);
        return scene;
      }

      // Frame the subject rather than using a fixed camera: species differ
      // enormously in size, and we are judging shape, not scale. Labels carry
      // the measured height so scale information is not lost.
      function frame(camera, target, radius, view) {
        const az = ((view.azimuth ?? 35) * Math.PI) / 180;
        const el = ((view.elevation ?? 14) * Math.PI) / 180;
        const dist = (radius / Math.sin((camera.fov * Math.PI) / 360)) * (view.margin ?? 1.06);
        camera.position.set(
          target.x + Math.sin(az) * Math.cos(el) * dist,
          target.y + Math.sin(el) * dist,
          target.z + Math.cos(az) * Math.cos(el) * dist
        );
        camera.lookAt(target);
        camera.near = Math.max(0.01, dist - radius * 3);
        camera.far = dist + radius * 6;
        camera.updateProjectionMatrix();
      }

      // Closeups aim at the places defects hide. Each returns a point plus how
      // tight to crop around it.
      function focusPoint(group, which) {
        const { bark, foliage } = collect(group);
        const box = new THREE.Box3().setFromObject(group);
        const size = box.getSize(new THREE.Vector3());
        const trunkR = bark.length ? Math.max(...bark.map((s) => s.radius)) : 0.4;

        if (which === 'root') {
          return { target: new THREE.Vector3(0, size.y * 0.05, 0), radius: Math.max(0.35, trunkR * 2.2) };
        }
        if (which === 'junction') {
          // Lowest branch that leaves the trunk — where joins look wrong.
          const off = bark.filter((s) => s.a.length() > trunkR * 0.9 || Math.abs(s.b.x - s.a.x) > 0.2);
          const low = off.sort((p, q) => p.a.y - q.a.y)[0];
          const t = low ? low.a : new THREE.Vector3(0, size.y * 0.45, 0);
          return { target: t, radius: Math.max(0.45, trunkR * 2.6) };
        }
        if (which === 'tip') {
          const tip = bark.sort((p, q) => q.b.y - p.b.y)[0]?.b ?? new THREE.Vector3(0, size.y * 0.8, 0);
          return { target: tip, radius: 1.3 };
        }
        // canopyEdge — the outermost leaf mass, where the crown boundary either
        // reads as one surface or as loose balls.
        const outer = foliage.sort(
          (p, q) => Math.hypot(q.centre.x, q.centre.z) - Math.hypot(p.centre.x, p.centre.z)
        )[0];
        return { target: outer?.centre ?? box.getCenter(new THREE.Vector3()), radius: 1.8 };
      }

      function renderCell(cell, w, h) {
        const group = buildTree(cell.params);
        const stats = diagnose(group);
        const mode = cell.mode ?? 'shaded';
        const view = cell.view ?? {};

        let target;
        let radius;
        if (view.focus) {
          ({ target, radius } = focusPoint(group, view.focus));
        } else {
          const box = new THREE.Box3().setFromObject(group);
          const sphere = box.getBoundingSphere(new THREE.Sphere());
          target = sphere.center;
          radius = sphere.radius;
        }

        const scene = buildScene(group, mode);
        const camera = new THREE.PerspectiveCamera(view.fov ?? 40, w / h, 0.1, 400);
        frame(camera, target, radius, view);

        renderer.setSize(w, h, false);
        renderer.render(scene, camera);
        return { canvas: renderer.domElement, stats };
      }

      /**
       * Render a grid of trees into a single labelled PNG and return it as a
       * data URL, together with the per-cell diagnostics.
       */
      window.renderSheet = function renderSheet(spec) {
        const cols = spec.cols ?? 4;
        const cw = spec.cellW ?? 300;
        const ch = spec.cellH ?? 360;
        const pad = 10;
        const label = 34;
        const head = spec.title ? 44 : 0;
        const rows = Math.ceil(spec.cells.length / cols);

        const sheet = document.createElement('canvas');
        sheet.width = cols * (cw + pad) + pad;
        sheet.height = head + rows * (ch + label + pad) + pad;
        const ctx = sheet.getContext('2d');
        ctx.fillStyle = spec.paper ?? '#ffffff';
        ctx.fillRect(0, 0, sheet.width, sheet.height);

        if (spec.title) {
          ctx.fillStyle = '#111';
          ctx.font = '600 20px system-ui, sans-serif';
          ctx.fillText(spec.title, pad, 29);
          if (spec.subtitle) {
            ctx.fillStyle = '#777';
            ctx.font = '13px system-ui, sans-serif';
            ctx.fillText(spec.subtitle, pad + ctx.measureText(spec.title).width + 14, 29);
          }
        }

        const all = [];
        spec.cells.forEach((cell, i) => {
          const { canvas, stats } = renderCell(cell, cw, ch);
          const x = pad + (i % cols) * (cw + pad);
          const y = head + pad + Math.floor(i / cols) * (ch + label + pad);
          ctx.drawImage(canvas, x, y, cw, ch);
          ctx.strokeStyle = '#e2e2de';
          ctx.strokeRect(x + 0.5, y + 0.5, cw, ch);

          ctx.fillStyle = '#111';
          ctx.font = '600 13px system-ui, sans-serif';
          ctx.fillText(cell.label ?? '', x + 2, y + ch + 15);
          ctx.fillStyle = '#888';
          ctx.font = '11px ui-monospace, monospace';
          const note =
            cell.note ??
            `${stats.triangles} tris · ${stats.meshes} mesh · air ${stats.sticksInAir} · float ${stats.floatingLeaves}`;
          ctx.fillText(note, x + 2, y + ch + 29);

          all.push({ label: cell.label, ...stats });
        });

        return { png: sheet.toDataURL('image/png'), stats: all };
      };

      window.presetNames = Object.keys(presets);
      window.presets = presets;
      window.inspectorReady = true;
    </script>
  </body>
</html>
